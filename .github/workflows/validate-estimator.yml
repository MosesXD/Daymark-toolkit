name: Validate Daymark estimator
on:
  pull_request:
    branches: [main]
    paths:
      - "estimator-core.js"
      - "estimator.js"
      - "project-estimator.html"
      - "tests/**"
      - ".github/workflows/validate-estimator.yml"
  push:
    branches: [main]
    paths:
      - "estimator-core.js"
      - "estimator.js"
      - "project-estimator.html"
      - "tests/**"
      - ".github/workflows/validate-estimator.yml"

jobs:
  estimator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check estimator scripts
        run: |
          node --check estimator-core.js
          node --check estimator.js
      - name: Run estimator regression tests
        run: node --test tests/*.test.cjs
